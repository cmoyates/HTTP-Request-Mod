name: Publish release
run-name: Publish a ${{ inputs.version_bump }} release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Semantic version part to increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out main with tags
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Calculate the next version
        id: version
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        shell: bash
        run: |
          set -euo pipefail

          current_version="$(grep -E '^mod_version=' gradle.properties | cut -d= -f2-)"
          if [[ ! "$current_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected mod_version to be a stable semantic version, got: $current_version" >&2
            exit 1
          fi

          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))

          case "$VERSION_BUMP" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported version bump: $VERSION_BUMP" >&2
              exit 1
              ;;
          esac

          next_version="${major}.${minor}.${patch}"
          tag="v${next_version}"

          if git rev-parse --quiet --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists" >&2
            exit 1
          fi

          sed -i "s/^mod_version=.*/mod_version=${next_version}/" gradle.properties

          {
            echo "current=${current_version}"
            echo "version=${next_version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing ${current_version} -> ${next_version}"

      - name: Build and test
        run: ./gradlew clean build --console=plain

      - name: Verify release artifact
        id: artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          artifact="build/libs/HTTPRequestMod-${VERSION}.jar"
          if [[ ! -f "$artifact" ]]; then
            echo "Expected release artifact was not built: $artifact" >&2
            exit 1
          fi

          metadata_version="$(unzip -p "$artifact" fabric.mod.json | jq -r '.version')"
          if [[ "$metadata_version" != "$VERSION" ]]; then
            echo "Artifact metadata version is ${metadata_version}, expected ${VERSION}" >&2
            exit 1
          fi

          artifact_name="$(basename "$artifact")"
          (
            cd build/libs
            sha256sum "$artifact_name" > "${artifact_name}.sha256"
          )

          {
            echo "path=${artifact}"
            echo "name=${artifact_name}"
            echo "checksum=${artifact}.sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and tag the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore(release): ${TAG}"
          git tag --annotate "$TAG" --message "HTTP Request Mod ${VERSION}"
          git push --atomic origin HEAD:main "$TAG"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ARTIFACT: ${{ steps.artifact.outputs.path }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          CHECKSUM: ${{ steps.artifact.outputs.checksum }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            "${ARTIFACT}#${ARTIFACT_NAME}" \
            "${CHECKSUM}#${ARTIFACT_NAME}.sha256" \
            --verify-tag \
            --title "HTTP Request Mod ${VERSION}" \
            --generate-notes

          release_url="$(gh release view "$TAG" --json url --jq '.url')"
          {
            echo "## HTTP Request Mod ${VERSION} published"
            echo
            echo "[View the release](${release_url})"
          } >> "$GITHUB_STEP_SUMMARY"
